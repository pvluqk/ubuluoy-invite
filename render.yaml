services:
  - type: web
    name: ubuluoy-invite
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_KEY
        value: ubuluoy-secret-2026
      - key: EVENT_ISO
        value: 2026-10-04T14:00:00+09:00
      - key: PYTHON_VERSION
        value: "3.12.0"
